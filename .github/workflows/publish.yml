name: Validate plugin tags and publish Python to PyPI

on:
  push:
    tags: ["v*", "plugin-v*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  verify-plugin-tag:
    needs: ci
    if: startsWith(github.ref_name, 'plugin-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify plugin tag matches plugin version
        run: |
          plugin_version="$(python - <<'PY'
          import json
          from pathlib import Path

          print(json.loads(Path("plugins/pine/.codex-plugin/plugin.json").read_text())["version"])
          PY
          )"
          test "$GITHUB_REF_NAME" = "plugin-v$plugin_version"

  publish:
    needs: ci
    if: startsWith(github.ref_name, 'v') && !startsWith(github.ref_name, 'plugin-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release tag matches package version
        run: |
          package_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])
          PY
          )"
          test "$GITHUB_REF_NAME" = "v$package_version"

      - name: Install build tools
        run: pip install build

      - name: Build distribution
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
